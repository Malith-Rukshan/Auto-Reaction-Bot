services:
  - type: web
    name: auto-reaction-bot
    runtime: node
    plan: starter
    repo: https://github.com/Malith-Rukshan/Auto-Reaction-Bot
    buildCommand: npm install
    startCommand: node api/index.js
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: EMOJI_LIST
        sync: false
      - key: RANDOM_LEVEL
        value: "0"
      - key: RESTRICTED_CHATS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: false
